name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridflex-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP (STAGING)
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY STAGING -
      # =====================================================
      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        shell: bash
        env:
          SERVER_USER: ${{ secrets.STAGING_SERVER_USER }}
          SERVER_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          LOCATION: ${{ secrets.LOCATION }}

          EUREKA_ADDRESS: ${{ secrets.EUREKA_ADDRESS }}
          EUREKA_PORT: ${{ secrets.EUREKA_PORT }}

          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: ${{ secrets.STAGING_DB_PORT }}
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

          MONGO_HOST: ${{ secrets.STAGING_MONGO_HOST }}
          MONGO_PORT: ${{ secrets.STAGING_MONGO_PORT }}
          MONGO_DB: ${{ secrets.STAGING_MONGO_DB }}
        run: |
          set -euo pipefail
          
          SERVER="${SERVER_USER}@${SERVER_HOST}"
          APP_DIR="/${LOCATION}"
          APP_JAR="${APP_DIR}/portal-onboard-service.jar"
          ENV_FILE="${APP_DIR}/.env.portal"
          APP_PROFILE="staging"
          
          SSH_OPTS="-o StrictHostKeyChecking=no"
          
          echo "Preparing staging directory..."
          ssh $SSH_OPTS "$SERVER" \
            "mkdir -p '$APP_DIR'"
          
          # Create the service only when systemd cannot find it.
          # Existing service configuration is never overwritten.
          echo "Checking systemd configuration..."
          
          ssh $SSH_OPTS "$SERVER" \
            "APP_DIR='$APP_DIR' APP_USER='$SERVER_USER' APP_PROFILE='$APP_PROFILE' bash -s" <<'REMOTE'
          set -euo pipefail
          
          if ! id "$APP_USER" >/dev/null 2>&1; then
            echo "Deployment user does not exist: $APP_USER"
            exit 1
          fi
          
          if ! sudo systemctl cat portal >/dev/null 2>&1; then
            echo "portal service not found. Creating systemd unit..."
          
            JAVA_BIN=$(command -v java || true)
          
            if [ -z "$JAVA_BIN" ]; then
              echo "Java is not installed or is not available in PATH."
              exit 1
            fi
          
            sudo tee /etc/systemd/system/portal.service >/dev/null <<UNIT
          [Unit]
          Description=Portal Onboard Spring Boot Application
          Wants=network-online.target
          After=network-online.target
          
          [Service]
          Type=simple
          User=$APP_USER
          WorkingDirectory=$APP_DIR
          EnvironmentFile=-$APP_DIR/.env.portal
          ExecStart=$JAVA_BIN -Dspring.profiles.active=$APP_PROFILE -jar $APP_DIR/portal-onboard-service.jar
          Restart=on-failure
          RestartSec=10
          SuccessExitStatus=143
          
          [Install]
          WantedBy=multi-user.target
          UNIT
          
            sudo systemctl daemon-reload
          else
            echo "Existing portal service found. Preserving its configuration."
          fi
          
          sudo systemctl enable portal
          REMOTE
          
          # Stop the managed service before replacing its JAR.
          echo "Stopping staging application..."
          ssh $SSH_OPTS "$SERVER" \
            "sudo systemctl stop portal || true"
          
          echo "Uploading staging JAR..."
          rsync -az -e "ssh $SSH_OPTS" \
            "$JAR_FILE" "$SERVER:$APP_JAR"
          
          echo "Writing staging environment file..."
          ssh $SSH_OPTS "$SERVER" \
            "umask 077; cat > '$ENV_FILE'" <<EOF
          EUREKA_ADDRESS=$EUREKA_ADDRESS
          EUREKA_PORT=$EUREKA_PORT
          LOCATION=$LOCATION
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          MONGO_HOST=$MONGO_HOST
          MONGO_PORT=$MONGO_PORT
          MONGO_DB=$MONGO_DB
          EOF
          
          # Restrict access to application configuration and secrets.
          ssh $SSH_OPTS "$SERVER" \
            "chmod 600 '$ENV_FILE'"
          
          echo "Starting staging application..."
          ssh $SSH_OPTS "$SERVER" \
            "sudo systemctl start portal"
          
          echo "Waiting for staging service..."
          ssh $SSH_OPTS "$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          
          for i in $(seq 1 12); do
            if sudo systemctl is-active --quiet portal; then
              echo "Portal service is active."
              exit 0
            fi
            sleep 5
          done
          
          echo "Portal failed to become active."
          sudo systemctl status portal --no-pager || true
          sudo journalctl -u portal -n 100 --no-pager || true
          exit 1
          REMOTE
          
          echo "Staging deployment completed successfully."

      # =====================================================
      # SSH SETUP (PRODUCTION)
      # =====================================================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY PRODUCTION -
      # =====================================================
      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          LOCATION: ${{ secrets.LOCATION }}

          EUREKA_ADDRESS: ${{ secrets.EUREKA_ADDRESS }}
          EUREKA_PORT: ${{ secrets.EUREKA_PORT }}

          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: ${{ secrets.PROD_DB_PORT }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

          MONGO_HOST: ${{ secrets.PROD_MONGO_HOST }}
          MONGO_PORT: ${{ secrets.PROD_MONGO_PORT }}
          MONGO_DB: ${{ secrets.PROD_MONGO_DB }}
          MONGO_USERNAME: ${{ secrets.PROD_MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.PROD_MONGO_PASSWORD }}
        run: |
          set -euo pipefail
          
          SERVER="${SERVER_USER}@${SERVER_HOST}"
          APP_DIR="/${LOCATION}"
          APP_JAR="${APP_DIR}/portal-onboard-service.jar"
          ENV_FILE="${APP_DIR}/.env.portal"
          APP_PROFILE="prod"
          
          SSH_OPTS="-o StrictHostKeyChecking=no"
          
          echo "Preparing production directory..."
          ssh $SSH_OPTS "$SERVER" \
            "mkdir -p '$APP_DIR'"
          
          # Create the service only when systemd cannot find it.
          # Existing service configuration is never overwritten.
          echo "Checking systemd configuration..."
          
          ssh $SSH_OPTS "$SERVER" \
            "APP_DIR='$APP_DIR' APP_USER='$SERVER_USER' APP_PROFILE='$APP_PROFILE' bash -s" <<'REMOTE'
          set -euo pipefail
          
          if ! id "$APP_USER" >/dev/null 2>&1; then
            echo "Deployment user does not exist: $APP_USER"
            exit 1
          fi
          
          if ! sudo systemctl cat portal >/dev/null 2>&1; then
            echo "portal service not found. Creating systemd unit..."
          
            JAVA_BIN=$(command -v java || true)
          
            if [ -z "$JAVA_BIN" ]; then
              echo "Java is not installed or is not available in PATH."
              exit 1
            fi
          
            sudo tee /etc/systemd/system/portal.service >/dev/null <<UNIT
          [Unit]
          Description=Portal Onboard Spring Boot Application
          Wants=network-online.target
          After=network-online.target
          
          [Service]
          Type=simple
          User=$APP_USER
          WorkingDirectory=$APP_DIR
          EnvironmentFile=-$APP_DIR/.env.portal
          ExecStart=$JAVA_BIN -Dspring.profiles.active=$APP_PROFILE -jar $APP_DIR/portal-onboard-service.jar
          Restart=on-failure
          RestartSec=10
          SuccessExitStatus=143
          
          [Install]
          WantedBy=multi-user.target
          UNIT
          
            sudo systemctl daemon-reload
          else
            echo "Existing portal service found. Preserving its configuration."
          fi
          
          sudo systemctl enable portal
          REMOTE
          
          echo "Stopping production application..."
          ssh $SSH_OPTS "$SERVER" \
            "sudo systemctl stop portal || true"
          
          echo "Uploading production JAR..."
          rsync -az -e "ssh $SSH_OPTS" \
            "$JAR_FILE" "$SERVER:$APP_JAR"
          
          echo "Writing production environment file..."
          ssh $SSH_OPTS "$SERVER" \
            "umask 077; cat > '$ENV_FILE'" <<EOF
          EUREKA_ADDRESS=$EUREKA_ADDRESS
          EUREKA_PORT=$EUREKA_PORT
          LOCATION=$LOCATION
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          MONGO_HOST=$MONGO_HOST
          MONGO_PORT=$MONGO_PORT
          MONGO_DB=$MONGO_DB
          MONGO_USERNAME=$MONGO_USERNAME
          MONGO_PASSWORD=$MONGO_PASSWORD
          EOF
          
          ssh $SSH_OPTS "$SERVER" \
            "chmod 600 '$ENV_FILE'"
          
          echo "Starting production application..."
          ssh $SSH_OPTS "$SERVER" \
            "sudo systemctl start portal"
          
          echo "Waiting for production service..."
          ssh $SSH_OPTS "$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          
          for i in $(seq 1 12); do
            if sudo systemctl is-active --quiet portal; then
              echo "Portal service is active."
              exit 0
            fi
            sleep 5
          done
          
          echo "Portal failed to become active."
          sudo systemctl status portal --no-pager || true
          sudo journalctl -u portal -n 100 --no-pager || true
          exit 1
          REMOTE
          
          echo "Production deployment completed successfully."



  deploy-alfuttaim:

    if: github.ref == 'refs/heads/alfuttaim'

    runs-on: ubuntu-latest

    env:
      APP_NAME: portal-onboard-service
      SERVICE_NAME: portal-onboard-service
      DEPLOY_DIR: 'C:\${{ secrets.WIN_LOCATION }}'
      JAR_NAME: portal-onboard-service.jar
      DELETE_JARS: ${{ secrets.DELETE_JARS }}

    steps:
      #######################################################
      # Checkout Repository
      #######################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #######################################################
      # Setup Java
      #######################################################
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      #######################################################
      # Locate JAR
      #######################################################
      - name: Locate Executable JAR
        shell: bash
        run: |

          JAR=$(find . \
            -type f \
            -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            ! -name "*original*.jar" \
            | head -n1)

          if [ -z "$JAR" ]; then
            echo "Executable jar not found."
            exit 1
          fi

          echo "Found: $JAR"

          cp "$JAR" app.jar

      #######################################################
      # Generate WinSW XML
      #######################################################
      - name: Generate WinSW XML
        shell: bash
        run: |
          cp deployment/portal-onboard-service.xml.template portal-onboard-service.xml
          
          PROD_DB_PASSWORD_XML=$(printf '%s' "${{ secrets.PROD_DB_PASSWORD }}" \
            | sed -e 's/&/\&amp;/g' \
            -e 's/</\&lt;/g' \
            -e 's/>/\&gt;/g' \
            -e "s/'/\&apos;/g" \
            -e 's/"/\&quot;/g')

          PROD_DB_PASSWORD_XML=$(printf '%s' "$PROD_DB_PASSWORD_XML" | sed 's/&/\\&/g')
          
          sed -i "s|\${EUREKA_ADDRESS}|${{ secrets.EUREKA_ADDRESS }}|g" portal-onboard-service.xml
          sed -i "s|\${EUREKA_PORT}|${{ secrets.EUREKA_PORT }}|g" portal-onboard-service.xml
          sed -i "s|\${WIN_LOCATION}|C:/${{secrets.WIN_LOCATION}}|g" portal-onboard-service.xml
          sed -i "s|\${PROD_DB_HOST}|${{ secrets.PROD_DB_HOST }}|g" portal-onboard-service.xml
          sed -i "s|\${PROD_DB_PORT}|${{ secrets.PROD_DB_PORT }}|g" portal-onboard-service.xml
          sed -i "s|\${PROD_DB_NAME}|${{ secrets.PROD_DB_NAME }}|g" portal-onboard-service.xml
          
          sed -i "s|\${PROD_DB_USERNAME}|${{ secrets.PROD_DB_USERNAME }}|g" portal-onboard-service.xml
          sed -i "s|\${PROD_DB_PASSWORD}|${PROD_DB_PASSWORD_XML}|g" portal-onboard-service.xml
          sed -i "s|\${PROD_MONGO_HOST}|${{ secrets.PROD_MONGO_HOST }}|g" portal-onboard-service.xml
          
          sed -i "s|\${PROD_MONGO_PORT}|${{ secrets.PROD_MONGO_PORT }}|g" portal-onboard-service.xml
          sed -i "s|\${PROD_MONGO_DB}|${{ secrets.PROD_MONGO_DB }}|g" portal-onboard-service.xml
          sed -i "s|\${PROD_MONGO_USERNAME}|${{ secrets.PROD_MONGO_USERNAME }}|g" portal-onboard-service.xml
          sed -i "s|\${PROD_MONGO_PASSWORD}|${{ secrets.PROD_MONGO_PASSWORD }}|g" portal-onboard-service.xml
          
          echo "Generated WinSW XML:"
          
          cat portal-onboard-service.xml

      #######################################################
      # Configure SSH
      #######################################################
      - name: Configure SSH
        shell: bash
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts

      #######################################################
      # Create Deployment Directory
      #######################################################
      - name: Create Deployment Directory
        run: |
          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference = 'Stop'
          
          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}' | Out-Null
          
          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}/logs' | Out-Null
          
          Write-Host "Deployment directory ready."
          
          EOF

      #######################################################
      # Create upload directory
      #######################################################
      - name: Create upload folder
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WINDOW_SERVER_HOST }}
          username: ${{ secrets.WINDOW_SERVER_USER }}
          key: ${{ secrets.WINDOW_SSH_PRIVATE_KEY }}
          script: |
            $dataDir = "C:/${{ secrets.WIN_LOCATION }}/upload"
            
            if (!(Test-Path $dataDir)) {
                New-Item -ItemType Directory -Path $dataDir | Out-Null
                Write-Host "Created: $dataDir"
            } else {
                Write-Host "Already exists: $dataDir"
            }

      #######################################################
      # Upload WinSW Wrapper
      #######################################################
      - name: Upload WinSW Wrapper
        run: |

          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'

          if (Test-Path 'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.exe') {

           Write-Host "WinSW wrapper already exists."
           Write-Host "Skipping wrapper upload."

           exit 0
          }

          Write-Host "WinSW wrapper does not exist."
          Write-Host "Wrapper will be uploaded."

          EOF

          WRAPPER_EXISTS=$(ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -Command \"if (Test-Path 'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.exe') { exit 0 } else { exit 1 }\"" \
          >/dev/null 2>&1 && echo "yes" || echo "no")

          if [ "$WRAPPER_EXISTS" = "no" ]; then

          echo "Uploading portal-onboard-service.exe..."

          scp \
           -i ~/.ssh/id_rsa \
           -o StrictHostKeyChecking=no \
           -o ServerAliveInterval=30 \
           -o ServerAliveCountMax=10 \
           deployment/portal-onboard-service.exe \
           "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.exe"

          else

          echo "portal-onboard-service.exe already exists. Upload skipped."

          fi


      #######################################################
      # Stop WinSW Service
      #######################################################
      - name: Stop Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name 'portal-onboard-service' -ErrorAction Stop
          
          if ($null -eq $service) {

            Write-Host "portal-onboard-service does not exist yet."
            Write-Host "Skipping stop. Service will be installed later."

            exit 0
          }

          Write-Host "Current Status: $($service.Status)"

          if ($service.Status -eq 'Running') {

              Write-Host "Stopping service..."

              Stop-Service -Name 'portal-onboard-service'

              $service.WaitForStatus(
                  'Stopped',
                  '00:00:30'
              )

          }

          $service = Get-Service -Name 'portal-onboard-service'

          if ($service.Status -ne 'Stopped') {

              throw "Failed to stop service."

          }

          Write-Host "Service stopped successfully."

          EOF

      #######################################################
      # Optional: Delete Existing JAR and Backup
      #######################################################
      - name: Delete Existing JAR and Backup
        if: env.DELETE_JARS == 'true'
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference = 'Stop'
          
          $files = @(
              "C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.jar",
              "C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.jar.bak"
          )
          
          foreach ($file in $files) {
              if (Test-Path $file) {
                  Remove-Item $file -Force
                  Write-Host "Deleted: $file"
              }
              else {
                  Write-Host "Not found: $file"
              }
          }
          
          EOF

      #######################################################
      # Backup Existing JAR
      #######################################################
      - name: Backup Existing JAR
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          $jar="C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.jar"

          $backup="C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.jar.bak"

          if(Test-Path $jar){

              Copy-Item `
                  $jar `
                  $backup `
                  -Force

              Write-Host "Backup completed."

          }
          else{

              Write-Host "No existing JAR. Backup skipped."

          }

          EOF

      #######################################################
      # Upload New JAR
      #######################################################
      - name: Upload Application
        run: |

          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{secrets.WIN_LOCATION}}/portal-onboard-service.jar"

      #######################################################
      # Upload WinSW XML
      #######################################################
      - name: Upload WinSW XML
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            portal-onboard-service.xml \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{secrets.WIN_LOCATION}}/portal-onboard-service.xml"

      #######################################################
      # Install WinSW Service If Missing
      #######################################################
      - name: Install WinSW Service If Missing
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference = 'Stop'

          $serviceName = 'portal-onboard-service'

          $base = 'C:/${{ secrets.WIN_LOCATION }}'

          $wrapper = "$base/portal-onboard-service.exe"

          $config = "$base/portal-onboard-service.xml"

          $service = Get-Service `
            -Name $serviceName `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {

              Write-Host ""
              Write-Host "============================================"
              Write-Host "Installing WinSW Service"
              Write-Host "============================================"

              if (!(Test-Path -LiteralPath $wrapper -PathType Leaf)) {
                  throw "WinSW wrapper not found: $wrapper"
              }

              if (!(Test-Path -LiteralPath $config -PathType Leaf)) {
                  throw "WinSW configuration not found: $config"
              }

              Write-Host "Wrapper: $wrapper"
              Write-Host "Config:  $config"

              Push-Location $base

              try {

                  & $wrapper install

                  if ($LASTEXITCODE -ne 0) {
                      throw "WinSW service installation failed."
                  }

              }
              finally {

                  Pop-Location
              }

              Write-Host "WinSW service installed successfully."

          }
          else {

              Write-Host ""
              Write-Host "portal-onboard-service already exists."
              Write-Host "Skipping WinSW installation."

          }

          EOF

      #######################################################
      # Verify Uploaded Files
      #######################################################
      - name: Verify Upload
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

              $files = @(
                  'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.exe',
                  'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.jar',
                  'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.xml'
              )
          
              foreach($file in $files){
          
                  if(!(Test-Path $file)){
                      throw "Missing: $file"
                  }
          
                  Write-Host "Verified: $file"
          
              }
          
              Get-ChildItem C:\${{ secrets.WIN_LOCATION }}

            END

      #######################################################
      # Start Windows Service
      #######################################################
      - name: Start Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          Write-Host "Starting portal-onboard-service..."

          Start-Service -Name "portal-onboard-service"

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "portal-onboard-service"

          $service.WaitForStatus(
              "Running",
              "00:00:30"
          )

          $service = Get-Service -Name "portal-onboard-service"

          if($service.Status -ne "Running"){

              throw "Service failed to start."

          }

          Write-Host "Service started successfully."

          EOF

      #######################################################
      # Verify Java Process
      #######################################################
      - name: Verify Java Process
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          $java = Get-CimInstance Win32_Process |
          Where-Object {

              $_.Name -eq "java.exe" -and
              $_.CommandLine -like "*portal-onboard-service.jar*"

          }

          if(!$java){

              throw "Java process not running."

          }

          Write-Host "Java PID: $($java.ProcessId)"

          EOF

      #######################################################
      # Verify Deployment
      #######################################################
      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "

            Write-Host ''

            Write-Host '========== SERVICE =========='

            Get-Service portal-onboard-service

            Write-Host ''

            Write-Host '========== FILES =========='

            Get-ChildItem C:/${{ secrets.WIN_LOCATION}}

            Write-Host ''

            Write-Host '========== LOGS =========='

            Get-ChildItem C:/${{ secrets.WIN_LOCATION }}/logs -ErrorAction SilentlyContinue

            "
      #######################################################
      # Display Logs On Failure
      #######################################################
      - name: Display Logs
        if: failure()
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "

            Write-Host ''
            Write-Host '========== WinSW OUT =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.out.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.out.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== WinSW ERR =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.err.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/portal-onboard-service.err.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== WRAPPER LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== SPRING LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/portal.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/portal.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== GC LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log' -Tail 100
            }

            "
          




