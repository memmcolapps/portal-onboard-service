spring.application.name=portal-onboard-service

spring.datasource.url=jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}?ApplicationName=portal-onboard-service
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#logging.level.org.postgresql=DEBUG

spring.data.mongodb.uri=mongodb://${PROD_MONGO_USERNAME}:${PROD_MONGO_PASSWORD}@${PROD_MONGO_HOST}:${PROD_MONGO_PORT}/${PROD_MONGO_DB}?authSource=${PROD_MONGO_USERNAME}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.table=flyway_schema_history_portal_onboard

# HikariCP settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.leak-detection-threshold=20000

logging.level.org.springframework.cloud.gateway=DEBUG
logging.file.name: C:/${WIN_LOCATION}/logs/portal-onboard.log

logging.logback.rollingpolicy=max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern: C:/${WIN_LOCATION}/logs/portal-onboard.%d{yyyy-MM-dd}.%i.log
